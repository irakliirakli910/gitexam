<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./contact.css">
</head>
<body>
    <div class="contact-container">
        <h1>მოგვწერეთ</h1>
        <form>
            <div class="form-group">
                <label for="name">სახელი:</label>
                <input type="text" id="name" placeholder="თქვენი სახელი..." required>
            </div>
            
            <div class="form-group">
                <label for="email">ელ-ფოსტა:</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="message">შეტყობინება:</label>
                <textarea id="message" rows="5" placeholder="როგორ დაგეხმაროთ?"></textarea>
            </div>

            <button type="submit" class="btn">გაგზავნა</button>
        </form>
    </div>
</body>
</html>
