<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./contact.css">
</head>
<body>
        <div class="contact-container">
        <h1>დაგვიკავშირდით</h1>

        <form>
            <label for="name">სახელი:</label>
            <input type="text" id="name" name="name" placeholder="თქვენი სახელი">

            <label for="email">ელფოსტა:</label>
            <input type="email" id="email" name="email" placeholder="თქვენი ელფოსტა">

            <label for="message">შეტყობინება:</label>
            <textarea id="message" name="message" placeholder="დაწერეთ თქვენი ტექსტი"></textarea>

            <button type="submit">გაგზავნა</button>
        </form>
    </div>
</body>
</html>
