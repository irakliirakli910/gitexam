<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>კონტაქტი</title>

    <link rel="stylesheet" href="Contact.css" />
  </head>
  <body>
    <!-- ჰედერი -->
    <header class="header">
      <div class="container">
        <h1>ჩემი ვებგვერდი</h1>

        <nav>
          <ul class="navigation">
            <li><a href="index.html">მთავარი</a></li>
            <li><a href="index.html#about">ჩვენ შესახებ</a></li>
            <li><a href="Contact.html">კონტაქტი</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- მთავარი კონტენტი -->
    <main class="contact-section">
      <div class="contact-container">
        <div class="contact-info">
          <h2>დაგვიკავშირდით</h2>

          <p>
            თუ გაქვთ რაიმე შეკითხვა, დაგვიკავშირდით მოცემული საკონტაქტო ფორმის
            გამოყენებით.
          </p>

          <p><strong>ელფოსტა:</strong> example@email.com</p>
          <p><strong>ტელეფონი:</strong> +995 555 123 456</p>
          <p><strong>მისამართი:</strong> თბილისი, საქართველო</p>
        </div>

        <!-- საკონტაქტო ფორმა -->
        <form class="contact-form">
          <label for="name">სახელი</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="შეიყვანეთ თქვენი სახელი"
            required
          />

          <label for="email">ელფოსტა</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="შეიყვანეთ თქვენი ელფოსტა"
            required
          />

          <label for="message">შეტყობინება</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="დაწერეთ თქვენი შეტყობინება"
            required
          ></textarea>

          <button type="submit">გაგზავნა</button>
        </form>
      </div>
    </main>

    <!-- ფუტერი -->
    <footer class="footer">
      <p>&copy; 2026 ჩემი ვებგვერდი. ყველა უფლება დაცულია.</p>
    </footer>
  </body>
</html>
